spring.application.name=homestay-backend

# ---- Database (values come from environment variables, with local defaults) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homestay_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" is convenient for local dev; switch to "validate" once you manage schema via migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- JWT ----
# IMPORTANT: override JWT_SECRET in production via environment variable. This default is for local dev only.
app.jwt.secret=${JWT_SECRET:local-dev-only-change-me-this-should-be-at-least-32-chars-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Default admin account (created automatically on first run if missing) ----
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:admin123}

# ---- Razorpay ----
# Use TEST mode keys (rzp_test_...) during development, LIVE keys (rzp_live_...) only once
# you're ready to accept real payments. Get these from the Razorpay Dashboard -> Settings -> API Keys.
# The key SECRET must never be sent to the frontend — only key-id (public) is sent, via
# PaymentDtos.CreateOrderResponse.razorpayKeyId.
app.razorpay.key-id=${RAZORPAY_KEY_ID:replace_this_text_with_your_razorpay_key_id}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:replace_this_text_with_your_razorpay_key_secret}

# ---- Homestay name (used in payment order receipts / responses only — NOT the content source
# of truth; that's frontend/src/content/homestay.js) ----
app.homestay-name=${HOMESTAY_NAME:Our Homestay}

# ---- Logging ----
logging.level.com.homestay.backend=INFO
